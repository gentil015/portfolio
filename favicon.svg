<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="128" cy="128" r="125" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#050508"/>
  
  <!-- Gradient circle -->
  <circle cx="128" cy="128" r="115" fill="url(#grad2)" opacity="0.1"/>
  
  <!-- Main circle with gradient -->
  <circle cx="128" cy="128" r="110" fill="url(#grad1)"/>
  
  <!-- Inner circle with darker background -->
  <circle cx="128" cy="128" r="105" fill="#0a0a12"/>
  
  <!-- Gradient accent -->
  <circle cx="128" cy="128" r="100" fill="url(#grad2)" opacity="0.2"/>
  
  <!-- Modern initials GD -->
  <text x="128" y="145" font-family="'Space Grotesk', sans-serif" font-size="72" font-weight="700" fill="url(#grad1)" text-anchor="middle" letter-spacing="-2">GD</text>
  
  <!-- Subtle glow effect -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.3" filter="blur(2px)"/>
</svg>